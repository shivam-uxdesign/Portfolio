<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shivam Sehgal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@1,500&display=swap">
<style>
/* VOICE: playful but calm, a designer's portfolio
   IDEA: a dress-up portrait that peeks over a wall of work
   PICTURE: vector Shivam with hats orbiting; on phones he hides behind the projects sheet
   COLOUR and TYPE: white and sage from the existing site; Plus Jakarta Sans + Playfair italic
   LAYOUT: centred column on tablet/desktop; 70/30 hero/sheet split on phones */
:root{--bg:#FFFFFF;--fg:#1C1C1A;--muted:#5A5A56;--sage:#8A9E7B;--accent:#8A9E7B;--shadow:rgba(20,20,18,.14);--glow:rgba(255,255,255,0);--font-body:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141412;--fg:#F2F1EF;--muted:#A5A39D;--sage:#9DB08E;--shadow:rgba(0,0,0,.5);--glow:rgba(255,255,255,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141412;--fg:#F2F1EF;--muted:#A5A39D;--sage:#9DB08E;--shadow:rgba(0,0,0,.5);--glow:rgba(255,255,255,.35);color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--font-body);padding:40px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px));overflow-x:clip}
.wrap{max-width:64rem;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:24px}
.identity{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;width:100%}
.txt{transition:opacity .35s,transform .45s}
.eyebrow{font-size:11px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
h1{margin:0;font-weight:500;line-height:.92;letter-spacing:-.04em;font-size:clamp(2.4rem,7vw,4rem);transition:letter-spacing .5s cubic-bezier(.16,1,.3,1)}
h1:hover{letter-spacing:.01em}
.tagline{margin:8px auto 0;font-size:14px;color:var(--muted);max-width:34em;min-height:3em;text-wrap:balance;transition:opacity .2s,transform .2s}
.tagline.swap{opacity:0;transform:translateY(5px)}
.tagline em{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:500;color:var(--accent);transition:color .6s}
.hint{margin:6px 0 0;font-size:12px;color:var(--muted);opacity:.8;transition:opacity .4s}
.stage{position:relative;width:clamp(300px,64vw,540px);aspect-ratio:1/1;user-select:none;-webkit-user-select:none}
#me{position:absolute;left:50%;top:54%;width:58%;height:auto;transform:translate(-50%,-50%);border-radius:24px;box-shadow:0 24px 48px -26px var(--shadow);cursor:pointer;-webkit-tap-highlight-color:transparent;overflow:hidden;transition:box-shadow .5s}
#bg rect,#bg circle{transition:fill .6s,opacity .5s}
.ring{position:absolute;border-radius:50%;border:2px dashed var(--accent);opacity:0;transform:scale(.8);transition:opacity .25s,transform .35s cubic-bezier(.3,1.5,.5,1);pointer-events:none;z-index:3}
.stage.dragging .ring{opacity:.6;transform:scale(1)}
.stage.dragging .ring.hot{opacity:1;transform:scale(1.12);border-style:solid}
.hat{position:absolute;left:0;top:0;width:var(--hs);height:var(--hs);padding:0;border:0;background:none;cursor:grab;touch-action:none;z-index:5;filter:drop-shadow(0 8px 8px rgba(0,0,0,.18)) drop-shadow(0 0 8px var(--glow));transition:opacity .35s;will-change:transform}
.hat svg{width:100%;height:100%;display:block;pointer-events:none;overflow:visible}
.hat.worn{opacity:0;pointer-events:none}
.hat .tag{position:absolute;left:50%;top:100%;transform:translate(-50%,2px);white-space:nowrap;font:600 11px var(--font-body);background:var(--fg);color:var(--bg);padding:3px 8px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none}
.hat:hover .tag,.hat:focus-visible .tag{opacity:1}
.hat:focus-visible{outline:2px solid var(--sage);outline-offset:3px;border-radius:12px}
.ripple{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:3px solid var(--accent);pointer-events:none;z-index:4;animation:rip .9s cubic-bezier(.2,.7,.3,1) forwards}
.p{position:absolute;left:0;top:0;pointer-events:none;z-index:6}
.speed{position:absolute;left:0;height:3px;border-radius:3px;background:var(--fg);opacity:.4;pointer-events:none;z-index:2}
.pop{position:absolute;z-index:7;background:#fff;color:#1d1d1d;font:600 12px var(--font-body);padding:7px 11px;border-radius:12px;box-shadow:0 10px 24px -8px rgba(0,0,0,.35);pointer-events:none;white-space:nowrap}
#me .m{display:none}
#me[data-mouth=grin] #m-grin,#me[data-mouth=o] #m-o,#me[data-mouth=small] #m-small,#me[data-mouth=smile] #m-smile,#me[data-mouth=flat] #m-flat,#me[data-mouth=tongue] #m-tongue,#me[data-mouth=laugh] #m-laugh,#me[data-mouth=hmm] #m-hmm{display:inline}
#me .eye>*{display:none}
#me[data-eyes=open] .pupil,#me[data-eyes=happy] .e-happy,#me[data-eyes=squint] .e-squint,#me[data-eyes=closed] .e-closed{display:inline}
#brow-l,#brow-r{transform-box:fill-box;transform-origin:50% 50%;transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
#me[data-brows=up] #brow-l,#me[data-brows=up] #brow-r{transform:translateY(-14px)}
#me[data-brows=down] #brow-l{transform:translateY(8px) rotate(8deg)}
#me[data-brows=down] #brow-r{transform:translateY(8px) rotate(-8deg)}
#me[data-brows=worried] #brow-l{transform:translateY(-6px) rotate(-10deg)}
#me[data-brows=worried] #brow-r{transform:translateY(-6px) rotate(10deg)}
#me[data-brows=think] #brow-l{transform:translateY(-9px) rotate(-14deg)}
#me[data-brows=think] #brow-r{transform:translateY(16px) rotate(6deg)}
#blush{transition:opacity .3s}
#me[data-blush=hot] #blush{opacity:.85}
#me[data-hat=helmet] #hair,#me[data-hat=helmet] #hair-under,#me[data-hat=helmet] #sideburns{display:none}
#me[data-hat=notes][data-brows=think][data-eyes=open] #thinklid{display:inline}
#me[data-mouth=soft] #m-soft{display:inline}
#head{transform-box:view-box;transform-origin:400px 620px;transition:transform .6s cubic-bezier(.3,1.5,.5,1)}
#me[data-hat=notes][data-eyes=happy][data-mouth=soft] #head{transform:rotate(-12deg)}
#glasses{transform-box:view-box;transform-origin:400px 440px}
#nose{transform-box:fill-box;transform-origin:50% 30%}
#ears{transform-box:view-box;transform-origin:400px 466px}
#hair{transform-box:view-box;transform-origin:400px 420px}
#props{transform-box:view-box;transform-origin:400px 230px}
#me .visor{transform-box:view-box;transform-origin:400px 342px;transform:translateY(-58px) scaleY(.3)}

.work{width:100%;display:flex;flex-direction:column;gap:10px}
.grip,.hands{display:none}
.label{margin:0;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cards{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:720px){.cards{grid-template-columns:1fr 1fr;gap:12px}}
.card{position:relative;display:block;overflow:hidden;border-radius:12px;min-width:0;height:230px;color:#fff;text-decoration:none;transition:transform .3s cubic-bezier(.34,1.2,.64,1)}
.card:hover{transform:translateY(-3px)}
.card:focus-visible{outline:2px solid var(--sage);outline-offset:3px}
.card .scrim{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,transparent 0%,rgba(0,0,0,.78) 45%,rgba(0,0,0,.95) 100%)}
.card .num{position:absolute;top:12px;right:12px;font-size:10px;font-weight:500;letter-spacing:.06em;padding:2px 8px;border-radius:999px;background:rgba(0,0,0,.3);backdrop-filter:blur(4px)}
.card .title{position:absolute;left:0;right:0;bottom:0;padding:16px 64px 16px 16px;font-size:12px;font-weight:500;line-height:1.35;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.card .view{position:absolute;right:16px;bottom:16px;font-size:10px;font-weight:500;opacity:0;transition:opacity .3s;white-space:nowrap;color:rgba(255,255,255,.85)}
.card:hover .view,.card:focus-visible .view{opacity:1}
@media (hover:none){.card .view{opacity:1}}
.thumb{position:absolute;inset:0;overflow:hidden}
.bar{border-radius:2px}
.t-dash{background:#0F1923}
.t-dash .top{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:#131F2E;border-bottom:1px solid #1D2D3E}
.t-dash .top .l{display:flex;align-items:center;gap:8px}
.t-dash .dot{width:8px;height:8px;border-radius:50%;background:#8A9E7B}
.t-dash .stats{display:flex;gap:8px;padding:12px 16px}
.t-dash .stat{flex:1;min-width:0;background:#131F2E;border-radius:8px;padding:10px}
.t-dash .stat b{display:block;font-size:8px;font-weight:600;color:#E0DDD8;margin-bottom:4px;white-space:nowrap}
.t-dash .track{height:4px;border-radius:99px;background:#1D2D3E}
.t-dash .track i{display:block;height:100%;border-radius:99px;background:#8A9E7B}
.t-dash .rows{padding:0 16px}
.t-dash .row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #1D2D3E}
.t-dash .row .d{width:6px;height:6px;border-radius:50%;flex:none}
.t-dash .row .id{width:32px;height:6px;background:#2A3D50;flex:none;border-radius:2px}
.t-dash .row .pg{flex:1;height:6px;background:#1D2D3E;border-radius:2px}
.t-dash .row .pg i{display:block;height:100%;border-radius:2px}
.t-dash .row .tag{width:56px;height:14px;border-radius:2px;flex:none}
.t-ds{background:#B8A898}
.t-ds .sheet{position:absolute;inset:12px;border-radius:16px;overflow:hidden;background:#FAF9F6;box-shadow:0 4px 20px rgba(0,0,0,.1)}
.t-ds .sec{padding:12px 16px 10px;border-bottom:1px solid #E8E7E4}
.t-ds .sw{display:flex;gap:6px;margin-top:8px}
.t-ds .sw i{width:20px;height:20px;border-radius:6px;border:1.5px solid rgba(0,0,0,.08);display:block}
.t-ds .btns{display:flex;gap:8px}
.t-ds .btn{height:24px;width:64px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.t-ds .tiles{padding:10px 16px 0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.t-ds .tiles div{background:#fff;border:1px solid #E8E7E4;border-radius:12px;padding:8px}

/* phones: 70/30 hero over a projects sheet */
@media (max-width:719px){
 html,body{height:100%;overflow:hidden;overscroll-behavior:none}
 body{padding:0}
 .wrap{height:100svh;display:block;position:relative;max-width:none}
 .identity{height:70svh;padding:max(18px,env(safe-area-inset-top,0px)) 16px 0;gap:0;touch-action:none;justify-content:flex-start}
 .txt{order:-1}
 h1{font-size:2.3rem}
 .tagline{font-size:13px;min-height:2.9em;margin-top:4px}
 .hint{display:none}
 .stage{width:100%;height:calc(70svh - 128px);aspect-ratio:auto;margin-top:2px}
 #me{width:min(66%,calc((70svh - 128px)*.62));top:51%}
 .work{position:fixed;left:0;right:0;bottom:0;height:72svh;z-index:10;background:var(--bg);border-radius:24px 24px 0 0;box-shadow:0 -12px 30px -14px var(--shadow);padding:10px 16px 0;transform:translateY(42svh);touch-action:none;gap:8px;will-change:transform}
 .grip{display:block;width:40px;height:5px;border-radius:9px;background:var(--muted);opacity:.35;margin:0 auto 4px}
 .scroller{overflow:hidden;flex:1;padding-bottom:max(24px,env(safe-area-inset-bottom,0px))}
 .card{height:200px}
 .hands{display:block;position:absolute;left:0;top:0;width:100%;height:0;pointer-events:none}
 .hand{position:absolute;opacity:0;overflow:visible}
 .stage{will-change:transform}
 .peek .work{touch-action:pan-y}
 .peek .scroller{overflow-y:auto}
 .peek #me{overflow:visible}
}
@media (max-width:719px) and (prefers-color-scheme:dark){:root:not([data-theme="light"]) .peek #me{filter:drop-shadow(0 0 10px rgba(255,255,255,.22))}}
:root[data-theme="dark"] .peek #me{filter:drop-shadow(0 0 10px rgba(255,255,255,.22))}
@keyframes rip{from{transform:scale(.3);opacity:1}to{transform:scale(7);opacity:0}}
@media (prefers-reduced-motion:no-preference){
 .eye{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4.2s infinite}
 #bodywrap{animation:breathe 4s ease-in-out infinite}
 #headwrap{transform-box:view-box;transform-origin:400px 640px;animation:bob 4s ease-in-out infinite}
 #me .on .visor{animation:visor 1.5s .1s both}
 .on .drip{transform-box:fill-box;transform-origin:50% 0;animation:drip 1s .3s ease-out both}
 .cattail{transform-box:view-box;transform-origin:300px 196px;animation:tail 2.4s ease-in-out infinite alternate}
 .catlid{transform-box:fill-box;transform-origin:50% 100%;animation:catblink 5s infinite}
 .tails{transform-box:view-box;transform-origin:560px 310px;animation:flap 1.6s ease-in-out infinite alternate}
}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes breathe{50%{transform:translateY(3px)}}
@keyframes bob{50%{transform:translateY(2px) rotate(-.6deg)}}
@keyframes visor{0%,48%{transform:none;animation-timing-function:ease-in}56%{transform:translateY(6px) scaleY(.98);animation-timing-function:cubic-bezier(.2,.8,.3,1)}84%{transform:translateY(-66px) scaleY(.26)}92%{transform:translateY(-54px) scaleY(.32)}100%{transform:translateY(-58px) scaleY(.3)}}
@keyframes drip{from{transform:scaleY(0)}to{transform:none}}
@keyframes tail{from{transform:rotate(-4deg)}to{transform:rotate(5deg)}}
@keyframes catblink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(1.9)}}
@keyframes flap{from{transform:skewY(-4deg)}to{transform:skewY(5deg) translateY(4px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
